[project]
name = "homescout"
version = "0.1.0"
description = "A local-first property search monitor."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
homescout = "homescout.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homescout"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: builds large fixtures; excluded from the default run",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
